gpfd:
  # This is the url which the Active directory dev app registration will redirect to after SSO is complete
  # baseUrl is a Spring Security template that resolves based on the current URL
  redirect-uri-template: "{baseUrl}/login/oauth2/code/gpfd-azure-dev"
  # Note,"gpfd-azure-dev" is also known as the Oauth2 'registrationId'
  security:
    login-registration-id: gpfd-azure-dev
    cors:
      allowed-origin: https://dev-laa-get-payments-finance-data.cloud-platform.service.justice.gov.uk

  # DEV MOJFIN database config
  datasource:
    read-only:
          url: ${MOJFIN_DB_URL}
          username: ${MOJFIN_DEV_READ_USERNAME}
          password: ${MOJFIN_DEV_READ_PASSWORD}
          driver-class-name: oracle.jdbc.pool.OracleDataSource
    write:
      url: ${MOJFIN_DB_URL}
      username: ${MOJFIN_DEV_WRITE_USERNAME}
      password: ${MOJFIN_DEV_WRITE_PASSWORD}
      driver-class-name: oracle.jdbc.pool.OracleDataSource

  s3:
    has-s3-access: true
    permissions:
      rep000: ${PERMISSION_REP000_GROUP_ID}
      submission-reconciliation: ${PERMISSION_SUBMISSION_RECONCILIATION_GROUP_ID}

  sds-enabled:
    enabled: true

  app:
    sds-api:
      url: https://login.microsoftonline.com/${SDS_TENANT_ID}/oauth2/v2.0/token
      scope: api://laa-sds-test/.default
      bucket-name: ${SDS_BUCKET_NAME:laa-sds-glad-test}
spring:
  security:
    oauth2:
      client:
        registration:
          gpfd-azure-dev:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: ${gpfd.redirect-uri-template}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            provider: gpfd-azure-dev
          sds-api-client:
            client-id: ${SDS_API_CLIENT_ID:${AZURE_CLIENT_ID}}
            client-secret: ${SDS_API_CLIENT_SECRET:${AZURE_CLIENT_SECRET}}
            scope: ${SDS_API_SCOPE:api://laa-sds-test/.default}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            provider: sds-api-client

        provider:
          gpfd-azure-dev:
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          sds-api-client:
            token-uri: https://login.microsoftonline.com/${SDS_TENANT_ID:${AZURE_TENANT_ID}}/oauth2/v2.0/token

app:
  sds-api:
    # Base URL of the SDS REST API (not the OAuth2 token endpoint)
    url: ${SDS_API_URL:https://laa-sds-test.apps.live.cloud-platform.service.justice.gov.uk}
    scope: ${SDS_API_SCOPE:api://laa-sds-test/.default}
    bucket-name: ${SDS_BUCKET_NAME:laa-sds-glad-test}
    client-registration-id: ${SDS_API_CLIENT_REGISTRATION_ID:sds-api-client}
    principal-name: ${SDS_API_PRINCIPAL_NAME:laa-sds-test}

server:
  port: 8080
  forward-headers-strategy: native # not sure if needed
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
        http-only: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
