sentry:
  enabled: false

logging:
  structured:
    format:
      console: "" # Disable ECS JSON locally for human-readable logs
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId},%X{spanId}] --- [%15.15t] %-40.40logger{39} : %m%n%wEx"
  level:
    root: INFO
    org:
      springframework:
        security: INFO
        jdbc:
          core:
            JdbcTemplate: INFO
            StatementCreatorUtils: INFO
        transaction: INFO
        web.client.RestTemplate: INFO

gpfd:
  url: http://localhost:8080
  redirect-uri-template: ${gpfd.url}/login/oauth2/code/gpfd-azure-dev
  security:
    cors:
      allowed-origin: http://localhost:8080

spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      client:
        registration:
          gpfd-azure-dev:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri:  ${gpfd.redirect-uri-template}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic

        provider:
          gpfd-azure-dev:
            issuer-uri: https://login.microsoftonline.com/${TENANT_ID}/v2.0

  main:
    allow-bean-definition-overriding: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true