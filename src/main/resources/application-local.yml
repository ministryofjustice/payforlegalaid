logging:
  structured:
    format:
      console: "" # Disable ECS JSON locally for human-readable logs
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId},%X{spanId}] --- [%15.15t] %-40.40logger{39} : %m%n%wEx"
  level:
    root: INFO
    org:
      springframework:
        security: INFO
        jdbc:
          core:
            JdbcTemplate: INFO
            StatementCreatorUtils: INFO
        transaction: INFO
        web.client.RestTemplate: INFO

gpfd:
  url: http://localhost:8080
  redirect-uri-template: ${gpfd.url}/login/oauth2/code/gpfd-azure-dev
  security:
    cors:
      allowed-origin: http://localhost:8080

  datasource:
    read-only:
      url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
      username: GPFD
      password: ${ORACLE_DB_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
    write:
      url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
      username: GPFD
      password: ${ORACLE_DB_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver

  sds-enabled:
    enabled: ${GPFD_SDS_ENABLED:true}

app:
  sds-api:
    # Base URL of the SDS REST API (not the OAuth2 token endpoint)
    url: ${SDS_API_URL:https://laa-sds-test.apps.live.cloud-platform.service.justice.gov.uk}
    scope: ${SDS_API_SCOPE:api://laa-sds-test/.default}
    bucket-name: ${SDS_BUCKET_NAME:laa-sds-glad-test}
    client-registration-id: ${SDS_API_CLIENT_REGISTRATION_ID:sds-api-client}
    principal-name: ${SDS_API_PRINCIPAL_NAME:laa-sds-test}

spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      client:
        registration:
          gpfd-azure-dev:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: ${gpfd.redirect-uri-template}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            provider: gpfd-azure-dev
          sds-api-client:
            client-id: ${SDS_API_CLIENT_ID:${AZURE_CLIENT_ID}}
            client-secret: ${SDS_API_CLIENT_SECRET:${AZURE_CLIENT_SECRET}}
            scope: ${SDS_API_SCOPE:api://laa-sds-test/.default}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            provider: sds-api-client

        provider:
          gpfd-azure-dev:
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:${AUTH_TENANT_ID:${TENANT_ID}}}/v2.0
          sds-api-client:
            token-uri: https://login.microsoftonline.com/${SDS_TENANT_ID:${AZURE_TENANT_ID:${AUTH_TENANT_ID:${TENANT_ID}}}}/oauth2/v2.0/token

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: GPFD
    password: ${ORACLE_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: GPFD
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    user: GPFD
    password: ${ORACLE_DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: none
    generate-ddl: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true