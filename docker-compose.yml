services:
  payforlegalaid:
    build:
      context: .
      dockerfile: ./local/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      secrets:
        - maven_settings
    container_name: payforlegalaid-local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      CLIENT_ID: ${CLIENT_ID}
      TENANT_ID: ${TENANT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      RDS_DB_HOST: payforlegalaid-local-postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: payforlegalaid-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: glad
      POSTGRES_USER: user
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "glad"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:

secrets:
  maven_settings:
    file: ${HOME}/.m2/settings.xml