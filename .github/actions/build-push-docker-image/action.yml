name: Build and push docker image
description: Build and push the docker image

inputs:
  github-username:
    required: true
    description: GitHub username
  github-token:
    required: true
    description: GitHub token
  sentry-auth-token:
    required: false
    description: Optional Sentry token for source-context upload

runs:
  using: composite

  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build with Maven
      shell: bash
      env:
        GITHUB_USERNAME: ${{ inputs.github-username }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
      run: |
        maven_profiles=()
        if [[ -n "${SENTRY_AUTH_TOKEN}" ]]; then
          maven_profiles+=(-Psentry-source-context)
        fi
        mvn -s .github/settings.xml -B -ntp "${maven_profiles[@]}" -DskipTests clean package

    - name: Build and push Docker image to container repository
      shell: bash
      env:
        REGISTRY: ${{ env.REGISTRY }}
        REPOSITORY: ${{ env.REPOSITORY }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG