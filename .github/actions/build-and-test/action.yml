name: Build and run tests
description: Build the application and run tests in a local environment

inputs:
  github-username:
    required: true
    description: GitHub username
  github-token:
    required: true
    description: GitHub token
  github-environment:
    required: false
    default: ''
    description: GitHub environment name (for conditional coverage enforcement)

runs:
  using: 'composite'
  steps:

    - name: Setup Java
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: 'corretto'
        java-version: '25'
        cache: 'maven'

    - name: Run unit tests with coverage enforcement
      if: ${{ github.event_name == 'pull_request' || inputs.github-environment == 'development' }}
      env:
        SPRING_PROFILES_ACTIVE: test
        GITHUB_USERNAME: ${{ inputs.github-username }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      shell:
        bash
      run: |
        mvn -s .github/settings.xml -ntp -B clean verify -Dtest='!*RunCucumberTest'

    - name: Run unit tests
      if: ${{ github.event_name != 'pull_request' && inputs.github-environment != 'development' }}
      env:
        SPRING_PROFILES_ACTIVE: test
        GITHUB_USERNAME: ${{ inputs.github-username }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      shell:
        bash
      run: |
        mvn -s .github/settings.xml -ntp -B clean test -Dtest='!*RunCucumberTest'

    - name: Upload JaCoCo Report (development and PR only)
      if: ${{ github.event_name == 'pull_request' || inputs.github-environment == 'development' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: jacoco-report-${{ github.job }}-${{ github.run_attempt }}
        path: target/site/jacoco