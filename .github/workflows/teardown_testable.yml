name: Tear Down Test Environment

on:
  delete:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Test branch environment to remove (test-*)'
        required: true
        type: string

concurrency:
  group: deploy-testable-refs/heads/${{ inputs.branch_name || github.event.ref }}
  cancel-in-progress: true

env:
  KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE_DEV }}

jobs:
  cleanup-testable:
    if: |
      (github.event_name == 'delete' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'test-')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.branch_name, 'test-'))
    environment: development
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Github Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate with Cloud Platform
        env:
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER_DEV }}
          KUBE_CERT: ${{ secrets.KUBE_CERT_DEV }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN_DEV }}
        run: |
          echo "${KUBE_CERT}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${KUBE_TOKEN}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
          kubectl config use-context ${KUBE_CLUSTER}

      - name: Delete Kubernetes resources
        env:
          BRANCH_NAME: ${{ inputs.branch_name || github.event.ref }}
        run: kubectl delete secret,service,ingress,pod,deployment -l "branch=${BRANCH_NAME}" -n "${KUBE_NAMESPACE}" --grace-period=0 --force --ignore-not-found=true
