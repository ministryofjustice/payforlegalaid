name: Feature build and test
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  feature_branch:
    environment: acceptance-tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed so AWS can login in the acceptance test action
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        uses: './.github/build-and-test'
        with:
          github-username: ${{ secrets.GITHUB_USERNAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          SOCKET_KEY: ${{ secrets.DEV_API_SOCKET_KEY }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ministryofjustice_payforlegalaid
            -Dsonar.organization=ministryofjustice
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Run acceptance tests
        uses: './.github/run_acceptance_tests'
        with:
          github-username: ${{ secrets.GITHUB_USERNAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          ROLE: ${{ secrets.FILE_STORE_UAT_S3_ROLE_TO_ASSUME }}
          AWS_REGION: ${{ vars.FILE_STORE_UAT_S3_REGION }}
          # We are using UAT right now as that is a stable environment.
          S3_BUCKET: ${{ vars.FILE_STORE_UAT_S3_BUCKET_NAME }}

      - name: Snyk Scan
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: './.github/snyk-scan'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
